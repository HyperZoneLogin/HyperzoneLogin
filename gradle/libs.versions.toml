metadata.format.version = "1.1"

[versions]

velocity = "4.1.0-SNAPSHOT"
asm = "9.7"
shadow = "9.4.1"
spotless = "7.2.1"
configurate = "4.2.0"
adventure = "4.19.0"
kotlin = "2.4.0"
angusMail = "2.0.4"
googleAuth = "1.5.0"

exposed = "0.58.0"
h2 = "2.1.214"
sqlite = "3.47.1.0"
mysql = "8.4.0"
mariadb = "3.4.1"
hikari = "5.0.1"
netty = "4.2.5.Final"
gson = "2.8.9"
log4j = "2.14.1"
guice = "4.2.3"
guava = "33.4.0-jre"
floodgate = "2.2.0-SNAPSHOT"
bstats = "3.2.1"
jarRelocator = "1.7"
junitBom = "5.10.0"
picocli = "4.7.6"
lombok = "1.18.46"

[libraries]

brigadier = "com.velocitypowered:velocity-brigadier:1.0.0-SNAPSHOT"
adventureApi = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventureNbt = { group = "net.kyori", name = "adventure-nbt", version.ref = "adventure" }
adventureTextSerializerGson = { group = "net.kyori", name = "adventure-text-serializer-gson", version.ref = "adventure" }
adventureTextSerializerJsonLegacyImpl = { group = "net.kyori", name = "adventure-text-serializer-json-legacy-impl", version.ref = "adventure" }
adventureTextSerializerLegacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
adventureTextSerializerPlain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
adventureTextLoggerSlf4j = { group = "net.kyori", name = "adventure-text-logger-slf4j", version.ref = "adventure" }
adventureTextMinimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }

velocityApi = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
velocityProxy = { group = "com.velocitypowered", name = "velocity-proxy", version.ref = "velocity" }

asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
