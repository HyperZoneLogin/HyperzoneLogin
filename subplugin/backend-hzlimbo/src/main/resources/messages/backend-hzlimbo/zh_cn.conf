# HyperZoneLogin backend-hzlimbo 模块消息 - 简体中文
# 该文件由插件在模块注册阶段复制到 messages/backend-hzlimbo/ 后加载，已存在时不会被覆盖。

backend-hzlimbo {
  usage {
    status = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>/hzlimbo status</yellow> <gray>查看后端运行状态</gray>"
    start = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>/hzlimbo start</yellow> <gray>启动后端</gray>"
    stop = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>/hzlimbo stop</yellow> <gray>停止后端</gray>"
    restart = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>/hzlimbo restart</yellow> <gray>重启后端</gray>"
    connections = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>/hzlimbo connections</yellow> <gray>查看当前连接数</gray>"
  }

  status {
    running = "<dark_gray>[<aqua>HzLimbo</aqua>] <green>后端正在运行</green>"
    stopped = "<dark_gray>[<aqua>HzLimbo</aqua>] <red>后端已停止</red>"
    address = "<dark_gray>[<aqua>HzLimbo</aqua>] <gray>绑定地址:</gray> <white><address></white>"
    uptime = "<dark_gray>[<aqua>HzLimbo</aqua>] <gray>运行时长:</gray> <white><uptime></white>"
    connections = "<dark_gray>[<aqua>HzLimbo</aqua>] <gray>当前连接:</gray> <white><count></white>"
    last-failure = "<dark_gray>[<aqua>HzLimbo</aqua>] <red>上次启动失败:</red> <white><reason></white>"
  }

  start {
    starting = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>正在启动后端...</yellow>"
    success = "<dark_gray>[<aqua>HzLimbo</aqua>] <green>后端已启动:</green> <white><address></white>"
    failed = "<dark_gray>[<aqua>HzLimbo</aqua>] <red>后端启动失败:</red> <white><reason></white>"
    already-running = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>后端已在运行中</yellow>"
  }

  stop {
    stopping = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>正在停止后端...</yellow>"
    success = "<dark_gray>[<aqua>HzLimbo</aqua>] <green>后端已停止</green>"
    not-running = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>后端本就未在运行</yellow>"
  }

  restart {
    restarting = "<dark_gray>[<aqua>HzLimbo</aqua>] <yellow>正在重启后端...</yellow>"
    success = "<dark_gray>[<aqua>HzLimbo</aqua>] <green>后端已重启:</green> <white><address></white>"
    failed = "<dark_gray>[<aqua>HzLimbo</aqua>] <red>重启后端失败:</red> <white><reason></white>"
  }

  connections {
    summary = "<dark_gray>[<aqua>HzLimbo</aqua>] <gray>当前连接数:</gray> <white><count></white>"
    empty = "<dark_gray>[<aqua>HzLimbo</aqua>] <gray>当前没有玩家连接</gray>"
  }

  busy = "<dark_gray>[<aqua>HzLimbo</aqua>] <red>另一个后端管理操作正在执行，请稍后再试</red>"
}
