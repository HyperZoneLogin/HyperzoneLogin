# HyperZoneLogin backend-hzlimbo 配置文件注释翻译 - 简体中文
# 本文件由插件自动加载，用于将配置文件中的翻译键替换为中文注释。
# 所有键均使用带引号的平铺格式，确保含点号的键不被 HOCON 解析为路径。

# HzLimboConfig
"config.hzlimbo.bind" = "内置 limbo 的监听地址（仅在 vServer.mode 不是 outpre 时使用；outpre 模式直接复用 v-server.outpre.auth-host/auth-port）"
"config.hzlimbo.bind.host" = "监听 Host"
"config.hzlimbo.bind.port" = "监听 Port"

"config.hzlimbo.world" = "初始空间（大厅）设置"
"config.hzlimbo.world.spawn-x" = "出生点 X（默认 8.0 = 3x3 区块石台的正中心）"
"config.hzlimbo.world.spawn-y" = "出生点 Y（建议在石台表面之上 1 格）"
"config.hzlimbo.world.spawn-z" = "出生点 Z（默认 8.0 = 3x3 区块石台的正中心）"
"config.hzlimbo.world.yaw" = "出生朝向（水平角，0 = 南）"
"config.hzlimbo.world.pitch" = "出生俯仰角"
"config.hzlimbo.world.chunk-radius" = "以出生点所在区块为中心发送的区块半径（1 = 3x3）"
"config.hzlimbo.world.allow-movement" = "是否允许玩家自由移动（false 则原地悬停）"
"config.hzlimbo.world.border" = "是否发送世界边界（范围与石台一致，防止玩家走出石台掉入虚空）"
"config.hzlimbo.world.platform" = "内置石台"
"config.hzlimbo.world.platform.enabled" = "是否生成内置石台"
"config.hzlimbo.world.platform.y" = "石台表面所在的方块 Y（石台为 1 格厚，覆盖发送的区块范围）"

"config.hzlimbo.read-timeout-seconds" = "连接读超时（秒）"
