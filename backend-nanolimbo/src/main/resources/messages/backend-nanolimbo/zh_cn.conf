# HyperZoneLogin backend-nanolimbo 模块消息 - 简体中文
# 该文件由插件在模块注册阶段复制到 messages/backend-nanolimbo/ 后加载，已存在时不会被覆盖。

backend-nanolimbo {
  usage {
    status = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>/hzl-limbo status</yellow> <gray>查看后端运行状态</gray>"
    start = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>/hzl-limbo start</yellow> <gray>启动后端</gray>"
    stop = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>/hzl-limbo stop</yellow> <gray>停止后端</gray>"
    restart = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>/hzl-limbo restart</yellow> <gray>重启后端并重新加载 settings.yml</gray>"
    connections = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>/hzl-limbo connections</yellow> <gray>查看当前连接数与连接列表</gray>"
  }

  status {
    running = "<dark_gray>[<gold>NanoLimbo</gold>] <green>后端正在运行</green>"
    stopped = "<dark_gray>[<gold>NanoLimbo</gold>] <red>后端已停止</red>"
    address = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>绑定地址:</gray> <white><address></white>"
    uptime = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>运行时长:</gray> <white><uptime></white>"
    connections = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>当前连接:</gray> <white><count></white><gray>/</gray><white><max_players></white>"
    transport = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>传输类型:</gray> <white><transport></white>"
    version = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>Limbo 版本:</gray> <white><version></white>"
    last-failure = "<dark_gray>[<gold>NanoLimbo</gold>] <red>上次启动失败:</red> <white><reason></white>"
  }

  start {
    starting = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>正在启动后端...</yellow>"
    success = "<dark_gray>[<gold>NanoLimbo</gold>] <green>后端已启动:</green> <white><address></white>"
    failed = "<dark_gray>[<gold>NanoLimbo</gold>] <red>后端启动失败:</red> <white><reason></white>"
    already-running = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>后端已在运行中</yellow>"
  }

  stop {
    stopping = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>正在停止后端...</yellow>"
    success = "<dark_gray>[<gold>NanoLimbo</gold>] <green>后端已停止</green>"
    not-running = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>后端本就未在运行</yellow>"
    failed = "<dark_gray>[<gold>NanoLimbo</gold>] <red>停止后端失败:</red> <white><reason></white>"
  }

  restart {
    restarting = "<dark_gray>[<gold>NanoLimbo</gold>] <yellow>正在重启后端...</yellow>"
    success = "<dark_gray>[<gold>NanoLimbo</gold>] <green>后端已重启:</green> <white><address></white>"
    failed = "<dark_gray>[<gold>NanoLimbo</gold>] <red>重启后端失败:</red> <white><reason></white>"
  }

  connections {
    summary = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>当前连接数:</gray> <white><count></white>"
    empty = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>当前没有玩家连接</gray>"
    entry = "<dark_gray>[<gold>NanoLimbo</gold>] <gray>#<index></gray> <white><name></white> <dark_gray>(<uuid>)</dark_gray> <gray><client_version></gray> <gray><player_address></gray>"
    address-redacted = "<dark_gray><redacted></dark_gray>"
  }

  busy = "<dark_gray>[<gold>NanoLimbo</gold>] <red>另一个后端管理操作正在执行，请稍后再试</red>"
}
