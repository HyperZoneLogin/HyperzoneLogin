# HyperZoneLogin Velocity messages - English

common {
  only-player = "<red>This command can only be used by players.</red>"
  no-permission = "<red>You do not have permission.</red>"
  player-state-unavailable = "<red>Unable to resolve the current login-session player.</red>"
}

chat {
  must-verify-before-chat = "<red>You must complete verification before chatting.</red>"
  only-allowed-commands = "<yellow>During authentication, only commands such as /login, /register, /rename, /changepassword, /email, /totp, and /bindcode are available.</yellow>"
  waiting-area-only = "<yellow>This command can only be used in the waiting-area server.</yellow>"
}

rename {
  usage = "<yellow>Usage: /rename <new-registration-name></yellow>"
  not-in-waiting-area = "<red>Only players still in the waiting area can change the current profile-registration name.</red>"
  already-bound = "<yellow>A formal profile is already attached. /rename only applies to waiting-area sessions that have not created a profile yet.</yellow>"
  same-as-current = "<yellow>The new registration name is the same as the current pending one.</yellow>"
  create-blocked = "<red>This name is still unavailable for profile creation: <reason></red><yellow>Please choose another non-conflicting name first, then continue.</yellow>"
  context-conflict = "<red>There are multiple pending profile-creation credential contexts, so /rename cannot be applied safely.</red>"
  success = "<green>The profile-registration name for this waiting-area session is now <white><name></white><green>. The pending flow is being retried with this name.</green>"
  remember-name = "<yellow>Please remember and use this name from now on: <white><name></white><yellow>.</yellow><gray>If a UUID conflict is still reported afterwards, this channel account is most likely already linked to another profile. Use /bindcode use [binding-code] to complete the link.</gray>"
  link-required = "<yellow>Your new name has already been remembered, but profile creation is still blocked by a UUID conflict: <reason></yellow><gray>A duplicate UUID is extremely unlikely; this usually means the channel account has not been linked to the correct profile yet. Use /bindcode use [binding-code] to complete the link.</gray>"
  event-failed = "<red>Failed to trigger the rename flow: <reason></red>"
}

bindcode {
  command-usage = "<yellow>Usage: /bindcode generate or /bindcode use [binding-code]</yellow>"
  command-use-usage = "<yellow>Usage: /bindcode use [binding-code]</yellow>"

  generate {
    no-user = "<red>No bound profile is attached right now, so a binding code cannot be generated.</red>"
    failed = "<red>Failed to generate a binding code. Please try again later.</red>"
  }

  existing {
    header = "<yellow>You already have an active binding code. Let the player who needs binding use it directly:</yellow>"
    footer = "<gray>Target profile: <white><profile_name></white><gray>; there is no need to generate a new one, and this code becomes invalid immediately after one use.</gray>"
  }

  generated {
    header = "<yellow>Binding code generated. Send it to the player who needs to bind:</yellow>"
    hover-copy = "<green>Click to copy the binding code</green>"
    footer = "<gray>Target profile: <white><profile_name></white><gray>; this code becomes invalid immediately after one use.</gray>"
  }

  use {
    verify-first = "<red>Please finish the current authentication flow before using a binding code.</red>"
    already-bound = "<yellow>You already have a bound profile, so you do not need to use another binding code.</yellow>"
    no-credentials = "<red>There are no verified credentials available for binding right now.</red>"
    empty = "<red>The binding code cannot be empty.</red>"
    invalid = "<red>The binding code does not exist, has expired, or has already been used.</red>"
    bind-failed = "<red>Binding failed. Please try again later.</red>"
    bind-failed-with-reason = "<red>Binding failed: <reason></red>"
    consume-failed = "<red>The binding was written, but destroying the binding code failed. Please contact an administrator.</red>"
    attach-failed = "<red>The binding code was destroyed, but attaching the profile failed. Please contact an administrator.</red>"
    attach-failed-with-reason = "<red>The binding code was destroyed, but attaching the profile failed: <reason></red>"
    success = "<green>Binding succeeded. It is now linked to profile <white><profile_name></white><green>.</green>"
  }
}

hzl {
  usage {
    reload = "<yellow>/hzl reload</yellow>"
    re = "<yellow>/hzl re</yellow>"
    bindcode-generate = "<yellow>/hzl bindcode generate</yellow>"
    bindcode-use = "<yellow>/hzl bindcode use [binding-code]</yellow>"
    uuid = "<yellow>/hzl uuid</yellow>"
    user = "<yellow>/hzl user | /hzl user list | /hzl user use [index|name|UUID]</yellow>"
    sync = "<yellow>/hzl sync [userUUID]</yellow>"
  }

  reloaded = "<green>Reloaded!</green>"
  config-regenerated = "<green>Regenerated <count> config file(s) (kept old values, removed extra keys, added missing defaults).</green>"
  reauth-start = "<yellow>Re-authentication has started...</yellow>"
  auth-flow-unavailable = "<red>No available authentication waiting-area flow is enabled right now.</red>"

  uuid {
    proxy-player = "<yellow>[ProxyPlayer] name=<name> uuid=<uuid></yellow>"
    session = "<yellow>[Session] name=<name> uuid=<uuid></yellow>"
    hyper-player = "<yellow>[HyperZonePlayer] verified=<verified> attachedUser=<attached_user> waitingArea=<waiting_area> registrationName=<registration_name> canCreateUser=<can_create_user> credentials=<credentials></yellow>"
    user = "<yellow>[User] id=<id> name=<name> uuid=<uuid></yellow>"
    user-null = "<yellow>[User] null</yellow>"
  }

  user {
    usage = "<yellow>Usage: /hzl user | /hzl user list | /hzl user use [index|name|UUID]</yellow>"
    no-user = "<red>No HZL profile is attached right now, so in-game identities cannot be listed.</red>"
    empty = "<yellow>This profile has no in-game identity records yet.</yellow>"
    list-header = "<green>Profile <white><user_uuid></white><green> has <white><count></white><green> in-game identities:</green>"
    entry = "<gray>[<index>] <name> (<uuid>)</gray>"
    entry-active = "<green>[<index>] <name> (<uuid>) active</green>"
    not-found = "<red>No matching in-game identity found: <target></red>"
    switched = "<green>Active in-game identity switched to <white><name></white><green> (<uuid>).</green><gray>The new identity takes effect on the next game-area entry/login.</gray>"
  }

  sync {
    usage = "<yellow>Usage: /hzl sync [userUUID] (userUUID is required from console)</yellow>"
    console-needs-id = "<red>userUUID is required when running sync from console.</red>"
    no-user = "<red>No HZL profile is attached right now, so sync cannot run.</red>"
    invalid-id = "<red>Invalid userUUID: <user_uuid></red>"
    not-found = "<red>Sync failed: user <user_uuid> was not found.</red>"
    failed = "<red>Sync failed: <reason></red>"
    result = "<green>Sync complete: profile <white><user_uuid></white><green>, scanned <white><scanned></white><green>, added <white><added></white><green>, existing <white><existing></white><green>, conflicts <white><conflicts></white><green>.</green>"
    conflict = "<red>Conflict: channel <channel>, name <name>, UUID <uuid>, reason: <reason></red>"
  }
}

player {
  enter-waiting-area = "<yellow>You have entered the waiting area. Please finish authentication and wait for your profile to be prepared.</yellow>"
  leave-waiting-area = "<green>You have left the waiting area.</green>"
  enter-game-area = "<green>You have entered the game area. Have fun!</green>"
  leave-game-area = "<yellow>You have left the game area.</yellow>"
  verified-unbound = "<yellow>Authentication passed, but no profile is bound yet.</yellow><gray>Recommended order:</gray><yellow> ① If this is a name conflict, use /rename [new-registration-name] first; ② if a UUID conflict is still reported after renaming, this channel account needs to be linked to an existing profile: use /bindcode use [binding-code].</yellow>"
  ingame-profile-conflict = "<red>Authentication passed, but the in-game identity provided by this channel conflicts with existing profiles: <reason></red><yellow>A duplicate UUID is extremely unlikely; this usually means the channel account has not been linked to the correct profile yet. Use /bindcode use [binding-code] to complete the link. If this channel is already bound to the wrong profile, contact an administrator.</yellow>"
  profile-conflict-self = "<red>Another session with the same profile is already playing or entering the game area. Your entry to the game area has been blocked.</red><yellow>If you are actually stuck on profile creation, first confirm whether the name is conflicting: use /rename <new-registration-name> first; if a UUID conflict is still reported afterwards, use /bindcode use [binding-code] to complete the link.</yellow>"
  profile-conflict-other = "<yellow>A duplicate login attempt with the same profile was detected. That session has been blocked from entering the game area.</yellow>"
}

backend-auth {
  no-auth-server = "<red>No available authentication waiting server is configured.</red>"
  enter-failed {
    exception = "<red>Failed to enter the authentication waiting server: <reason></red>"
    reason = "<red>Failed to enter the authentication waiting server: <reason></red>"
  }
  misconfigured-disconnect = "<red>The authentication waiting server is misconfigured. Please contact an administrator.</red>"
  unavailable-disconnect = "<red>The authentication waiting server is unavailable. Please contact an administrator.</red>"
  must-verify-before-transfer = "<yellow>Please finish authentication before entering other servers.</yellow>"

  exit {
    no-target = "<yellow>There is currently no return target server, so the authentication waiting area cannot be exited.</yellow>"
    server-missing = "<red>Failed to return to the target server after leaving the authentication waiting area: target server <white><server></white><red> does not exist.</red>"
    failure-exception = "<red>Failed to return to the target server after leaving the authentication waiting area: <reason></red>"
    failure-reason = "<red>Failed to return to the target server after leaving the authentication waiting area: <reason></red>"
  }

  verified {
    no-target = "<yellow>Authentication completed, but there is currently no target server to return to automatically.</yellow>"
    server-missing = "<red>Authentication completed, but the auto-return target server <white><server></white><red> does not exist.</red>"
    failure-exception = "<red>Authentication completed, but auto-connecting to the target server failed: <reason></red>"
    failure-reason = "<red>Authentication completed, but auto-connecting to the target server failed: <reason></red>"
  }
}

exit {
  still-in-waiting-area = "<red>You are still in the waiting area: authentication is not finished or the game profile is not bound yet.</red>"
  not-in-waiting-area = "<yellow>You are not currently in an exitable authentication waiting area.</yellow>"
  attempted = "<green>Attempted to exit the authentication waiting area.</green>"
}

over {
  usage = "<yellow>Usage: /over</yellow>"
  disabled = "<yellow>Slow-test mode is disabled, so /over is unavailable.</yellow>"
  not-in-waiting-area = "<red>Only players who are still in the waiting area can use /over.</red>"
  failed = "<red>/over failed. Please verify the current credential/profile state and try again.</red>"
  blocked-by-slow-test = "<yellow>Slow-test mode is enabled.</yellow><gray> Direct external overVerify calls are being ignored; enter </gray><white>/over</white><gray> in the core waiting area to complete final verification.</gray>"
}

