name: Weekly Release

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # backend-nanolimbo 是 HZL-nanolimbo submodule（其内部还有 NanoLimbo submodule）；
          # 它不嵌入 all-in-one，但会作为可选模块单独构建/发布。
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The whole project targets Java 25 (subprojects sets jvmToolchain(25));
          # :vc-runtest compiles with --release 25, so a non-25 JDK fails with
          # "release version 25 not supported".
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compute weekly tag
        id: meta
        run: |
          TAG="weekly-$(date -u +%G).W$(date -u +%V)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=HyperZoneLogin $TAG" >> "$GITHUB_OUTPUT"

      - name: Build plugin jars
        run: ./gradlew clean build buildAllDistributions buildCtdDistributions -PreleaseChannel=WEEKLY

      - name: Update weekly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.tag }}"
          git push origin "refs/tags/${{ steps.meta.outputs.tag }}" --force

      - name: Publish weekly prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: |
            build/HZL/*
            build/HZL-split/*
            build/HZL-ctd/*
          body: |
            This is an automatically generated weekly prerelease build for HyperZoneLogin.

            - `build/HZL/`: all-in-one plugin (plugin + embedded modules + CLI)
            - `build/HZL-split/`: split plugin and optional module jars (incl. `backend-nanolimbo`)
            - `build/HZL-ctd/`: VelocityCTD-flavored all-in-one plugin

            The optional `backend-nanolimbo` module is maintained in the separate
            [HZL-nanolimbo](https://github.com/HyperZoneLogin/HZL-nanolimbo) repository and is not bundled
            into the all-in-one jar.

            If you encounter issues, please open an Issue and include environment, modules, logs, config snippets, and reproduction steps.
          generateReleaseNotes: true

      # 同步触发 HZL-nanolimbo 仓库的发布（可选；需要配置 HZL_NANOLIMBO_TOKEN）。
      - name: Dispatch HZL-nanolimbo release
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.HZL_NANOLIMBO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HZL_NANOLIMBO_TOKEN 未配置，跳过 HZL-nanolimbo 同步发布。"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HyperZoneLogin/HZL-nanolimbo/dispatches \
            -d '{"event_type":"hzl-weekly","client_payload":{"tag":"${{ steps.meta.outputs.tag }}"}}'

