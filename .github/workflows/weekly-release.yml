name: Weekly Release

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # backend-nanolimbo 是 HZL-nanolimbo submodule（其内部还有 NanoLimbo submodule）；
          # 它不嵌入 all-in-one，但会作为可选模块单独构建/发布。
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The whole project targets Java 25 (subprojects sets jvmToolchain(25));
          # :vc-runtest compiles with --release 25, so a non-25 JDK fails with
          # "release version 25 not supported".
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compute weekly tag
        id: meta
        run: |
          TAG="weekly-$(date -u +%G).W$(date -u +%V)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=HyperZoneLogin $TAG" >> "$GITHUB_OUTPUT"

      - name: Build plugin jars
        run: ./gradlew clean build buildAllDistributions -PreleaseChannel=WEEKLY

      # VelocityCTD 构建用独立的 Gradle 进程，失败时不应阻塞主产物发布。
      # continue-on-error 会保留失败步骤的红色标记，但工作流继续执行。
      - name: Build VelocityCTD plugin jars (optional)
        id: ctd
        continue-on-error: true
        run: ./gradlew buildCtdDistributions -PreleaseChannel=WEEKLY

      - name: Note VelocityCTD failure
        if: steps.ctd.outcome == 'failure'
        run: echo "::warning::VelocityCTD 构建失败，已跳过 CTD 产物，其余产物照常发布。"

      # 先把本次成功产出的 jar 收进 release-artifacts，避免 CTD 目录为空时
      # release 步骤的 glob 匹配不到文件而整体失败。
      - name: Collect release artifacts
        env:
          CTD_OUTCOME: ${{ steps.ctd.outcome }}
        run: |
          mkdir -p release-artifacts
          cp -f build/HZL/*.jar release-artifacts/
          cp -f build/HZL-split/*.jar release-artifacts/
          if [ "$CTD_OUTCOME" = "success" ] && compgen -G "build/HZL-ctd/*.jar" > /dev/null; then
            cp -f build/HZL-ctd/*.jar release-artifacts/
          else
            echo "本次没有可用的 VelocityCTD 产物，跳过 CTD jar。"
          fi
          ls -l release-artifacts

      - name: Update weekly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.tag }}"
          git push origin "refs/tags/${{ steps.meta.outputs.tag }}" --force

      - name: Publish weekly prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: |
            release-artifacts/*
          body: |
            This is an automatically generated weekly prerelease build for HyperZoneLogin.

            - All-in-one plugin (plugin + embedded modules + CLI)
            - Split plugin and optional module jars (incl. `backend-nanolimbo`)
            - VelocityCTD-flavored all-in-one plugin (only when the optional CTD build succeeds)

            The optional `backend-nanolimbo` module is maintained in the separate
            [HZL-nanolimbo](https://github.com/HyperZoneLogin/HZL-nanolimbo) repository and is not bundled
            into the all-in-one jar.

            If you encounter issues, please open an Issue and include environment, modules, logs, config snippets, and reproduction steps.
          generateReleaseNotes: true

      # 同步触发 HZL-nanolimbo 仓库的发布（可选；需要配置 HZL_NANOLIMBO_TOKEN）。
      - name: Dispatch HZL-nanolimbo release
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.HZL_NANOLIMBO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HZL_NANOLIMBO_TOKEN 未配置，跳过 HZL-nanolimbo 同步发布。"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HyperZoneLogin/HZL-nanolimbo/dispatches \
            -d '{"event_type":"hzl-weekly","client_payload":{"tag":"${{ steps.meta.outputs.tag }}"}}'

