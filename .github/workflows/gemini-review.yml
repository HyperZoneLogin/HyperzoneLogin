name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '请输入需要 Review 的 PR 编号 (例如: 1)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Review Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          node -e '
          const https = require("https");

          async function request(url, options = {}, data = null) {
            return new Promise((resolve, reject) => {
              const req = https.request(url, options, (res) => {
                let body = "";
                res.on("data", (chunk) => body += chunk);
                res.on("end", () => resolve({ status: res.statusCode, body }));
              });
              req.on("error", reject);
              if (data) req.write(data);
              req.end();
            });
          }

          async function run() {
            const prNumber = process.env.INPUT_PR || process.env.EVENT_PR;
            if (!prNumber) throw new Error("无法获取 PR 编号！");

            const repo = process.env.REPO_NAME;
            const ghToken = process.env.GITHUB_TOKEN;
            const geminiKey = process.env.GEMINI_API_KEY;

            console.log(`正在获取 PR #${prNumber} 的 Diff...`);

            // 1. 获取 PR 的 diff 内容
            const diffRes = await request(`https://api.github.com/repos/${repo}/pulls/${prNumber}`, {
              method: "GET",
              headers: {
                "User-Agent": "Actions-Gemini-Review",
                "Authorization": `Bearer ${ghToken}`,
                "Accept": "application/vnd.github.v3.diff"
              }
            });

            if (diffRes.status !== 200) {
              throw new Error(`获取 Diff 失败 (${diffRes.status}):${diffRes.body}`);
            }

            const diff = diffRes.body;
            if (!diff.trim()) {
              console.log("PR 无代码变动，跳过审查。");
              return;
            }

            // 限制长度避免过长
            const truncatedDiff = diff.slice(0, 30000);

            console.log("正在调用 Gemini API 进行审查...");

            // 2. 调用 Gemini API
            const prompt = `你是一个资深代码评审专家。请用中文对以下 GitHub PR 代码变更（diff）进行全面代码审查。请指出潜在 Bug、安全性漏洞、性能问题和代码规范建议，并给出具体修改示例：\n\n\`\`\`diff\n${truncatedDiff}\n\`\`\``;

            const geminiReqBody = JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            });

            const geminiRes = await request(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" }
              },
              geminiReqBody
            );

            if (geminiRes.status !== 200) {
              throw new Error(`Gemini API 报错 (${geminiRes.status}): ${geminiRes.body}`);
            }

            const geminiData = JSON.parse(geminiRes.body);
            const reviewComment = geminiData.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!reviewComment) throw new Error("Gemini 未返回评审内容。");

            // 3. 在 PR 中发表评论
            console.log("正在向 PR 发送评论...");
            const commentBody = JSON.stringify({
              body: `### 🤖 Gemini 代码审查建议\n\n${reviewComment}`
            });

            const commentRes = await request(
              `https://api.github.com/repos/${repo}/issues/${prNumber}/comments`,
              {
                method: "POST",
                headers: {
                  "User-Agent": "Actions-Gemini-Review",
                  "Authorization": `Bearer ${ghToken}`,
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json"
                }
              },
              commentBody
            );

            if (commentRes.status !== 201) {
              throw new Error(`发表评论失败 (${commentRes.status}): ${commentRes.body}`);
            }

            console.log("✅ 审查评论已成功发表到 PR！");
          }

          run().catch((err) => {
            console.error("❌ 执行出错:", err.message);
            process.exit(1);
          });
          '